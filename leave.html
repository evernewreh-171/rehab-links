<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>休假預排總表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --ink:#1F2A37;
    --ink-soft:#5B6675;
    --line:#E2E8F0;
    --teal:#0EA5A4;
    --teal-deep:#0B7A79;
    --warn:#F0653E;
    --warn-bg:#FFF1EC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","Zen Maru Gothic",sans-serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  .top{
    background:linear-gradient(160deg,var(--teal-deep),var(--teal) 65%);
    color:#fff;
    padding:28px 20px 34px;
    position:relative;
    overflow:hidden;
  }
  .top::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:180px; height:180px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.85;
    margin:0 0 6px;
  }
  h1{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:24px;
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  .sub{
    font-size:13px;
    opacity:.92;
    margin:0;
    line-height:1.6;
  }
  .status-flag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.35);
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-family:"JetBrains Mono",monospace;
  }
  .refresh-btn{
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    padding:4px 10px;
    border-radius:20px;
    cursor:pointer;
  }
  .refresh-btn:active{ transform:scale(0.96); }

  .apply-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
    background:#fff;
    color:var(--teal-deep);
    font-family:"Noto Sans TC",sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 16px;
    border-radius:10px;
    text-decoration:none;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .apply-btn:active{ transform:scale(0.97); }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:16px 20px 4px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:10px;
    background:var(--surface);
    color:var(--ink-soft);
    border:1px solid var(--line);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  main{ padding:12px 20px 0; }

  .state-box{
    background:var(--surface);
    border-radius:16px;
    border:1px solid var(--line);
    padding:32px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }

  .month-card{
    background:var(--surface);
    border-radius:16px;
    border:1px solid var(--line);
    padding:18px 16px 20px;
    margin-bottom:16px;
    display:none;
  }
  .month-card.active{ display:block; }

  .month-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .month-head h2{
    font-size:16px;
    margin:0;
    font-weight:700;
  }
  .month-head span{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  .ruler{
    display:flex;
    font-family:"JetBrains Mono",monospace;
    font-size:9px;
    color:var(--ink-soft);
    margin-bottom:6px;
    padding-left:78px;
    position:relative;
    height:14px;
  }
  .ruler span{ position:absolute; transform:translateX(-50%); }

  .row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .row:last-child{ margin-bottom:0; }
  .name{
    flex:0 0 68px;
    font-size:12px;
    font-weight:500;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .track{
    position:relative;
    flex:1;
    height:26px;
    background:repeating-linear-gradient(
      to right, transparent, transparent calc(100%/7 - 1px), var(--line) calc(100%/7 - 1px), var(--line) calc(100%/7)
    );
    border-radius:7px;
  }
  .bar{
    position:absolute;
    top:3px; bottom:3px;
    border-radius:6px;
    display:flex;
    align-items:center;
    padding:0 8px;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.12);
  }
  .bar.overlap{
    outline:2px solid var(--warn);
    outline-offset:1px;
  }

  .flag-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    padding:8px 10px;
    background:var(--warn-bg);
    border-radius:10px;
    font-size:11.5px;
    color:#B5391F;
  }
  .flag-row b{ font-weight:700; }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    padding:16px 20px 0;
    font-size:11px;
    color:var(--ink-soft);
  }
  .legend .dot{
    width:8px;height:8px;border-radius:50%;
    display:inline-block;margin-right:5px;
    position:relative; top:-1px;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:28px;
    padding:0 20px;
    line-height:1.7;
  }
</style>
</head>
<body>

<div class="top">
  <p class="eyebrow">營新醫院 · 復健科</p>
  <h1>休假預排總表</h1>
  <p class="sub">看看同事排了哪幾天，選假期前先確認一下，避免同時段人力不足。</p>
  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <span class="status-flag" id="statusFlag">載入中…</span>
    <button class="refresh-btn" id="refreshBtn">🔄 重新整理</button>
  </div>
  <a class="apply-btn" href="https://forms.cloud.microsoft/r/Ny1bn9f5TW" target="_blank" rel="noopener">
    ✏️ 我要申請休假
  </a>
</div>

<div class="tabs" id="tabs"></div>
<div class="legend" id="legend"></div>
<main id="main"></main>

<footer>資料每次核准後自動更新・僅供內部同仁查閱・網頁請勿外流</footer>

<script>
// ====== 這裡換成你發佈的 Google 試算表 CSV 連結 ======
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTynw7JL3MDlhKZjdlwGXXHDMuO04627rmjw0V1Sc4UqHwXSEo5zF635XP-vjbcf8IlKAoF5XmuIum_/pub?gid=0&single=true&output=csv";

const PALETTE = ["#0EA5A4","#6366F1","#F59E0B","#EC4899","#38BDF8","#8B5CF6"];
const personColor = {};
let colorIdx = 0;
function colorFor(name){
  if(!personColor[name]){
    personColor[name] = PALETTE[colorIdx % PALETTE.length];
    colorIdx++;
  }
  return personColor[name];
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  const rows = lines.map(line => {
    // 簡易 CSV 解析，處理雙引號包住的欄位
    const cells = [];
    let cur = "", inQuotes = false;
    for(let i=0; i<line.length; i++){
      const c = line[i];
      if(c === '"'){ inQuotes = !inQuotes; continue; }
      if(c === ',' && !inQuotes){ cells.push(cur); cur=""; continue; }
      cur += c;
    }
    cells.push(cur);
    return cells.map(c => c.trim());
  });
  return rows;
}

function parseFlexibleDate(str){
  str = (str || "").trim();
  let m = str.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = str.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m) return new Date(+m[3], +m[1]-1, +m[2]);
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

function fmt(d){
  return (d.getMonth()+1) + "/" + d.getDate();
}
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function monthKey(y,m){ return y+"-"+String(m+1).padStart(2,"0"); }

const statusFlag = document.getElementById("statusFlag");
const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");
const legendEl = document.getElementById("legend");

async function load(){
  statusFlag.textContent = "載入中…";
  tabsEl.innerHTML = "";
  legendEl.innerHTML = "";
  mainEl.innerHTML = `<div class="state-box">資料讀取中，請稍候…</div>`;

  try{
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);

    if(rows.length <= 1){
      mainEl.innerHTML = `<div class="state-box">目前還沒有已核准的休假資料</div>`;
      statusFlag.textContent = "已更新・目前無資料";
      return;
    }

    const header = rows[0];
    const nameIdx = header.indexOf("姓名");
    const startIdx = header.indexOf("休假起始日期") >= 0 ? header.indexOf("休假起始日期") : header.indexOf("起始日");
    const endIdx = header.indexOf("休假結束日期") >= 0 ? header.indexOf("休假結束日期") : header.indexOf("結束日");

    const DATA = rows.slice(1).map(r => {
      const s = parseFlexibleDate(r[startIdx]);
      const e = parseFlexibleDate(r[endIdx]);
      if(!r[nameIdx] || !s || !e) return null;
      return { name: r[nameIdx], start: s, end: e };
    }).filter(Boolean);

    render(DATA);
    statusFlag.textContent = "已更新・共 " + DATA.length + " 筆";
  }catch(err){
    mainEl.innerHTML = `<div class="state-box">資料讀取失敗，請稍後再試一次<br><span style="font-family:'JetBrains Mono',monospace;font-size:10px;">${err.message}</span></div>`;
    statusFlag.textContent = "讀取失敗";
  }
}

function render(DATA){
  tabsEl.innerHTML = "";
  legendEl.innerHTML = "";
  mainEl.innerHTML = "";

  const months = new Set();
  DATA.forEach(e=>{
    let d = new Date(e.start.getFullYear(), e.start.getMonth(), 1);
    const end = e.end;
    while(d.getFullYear() < end.getFullYear() || (d.getFullYear()===end.getFullYear() && d.getMonth()<=end.getMonth())){
      months.add(monthKey(d.getFullYear(), d.getMonth()));
      d = new Date(d.getFullYear(), d.getMonth()+1, 1);
    }
  });
  const monthList = Array.from(months).sort();

  if(monthList.length === 0){
    mainEl.innerHTML = `<div class="state-box">目前還沒有已核准的休假資料</div>`;
    return;
  }

  const namesSeen = [];
  DATA.forEach(e=>{ if(!namesSeen.includes(e.name)) namesSeen.push(e.name); });
  legendEl.innerHTML = namesSeen.map(n=>
    `<span><span class="dot" style="background:${colorFor(n)}"></span>${n}</span>`
  ).join("") + `<span><span class="dot" style="background:transparent;border:2px solid #F0653E"></span>日期重疊</span>`;

  // 預設顯示：今天所在月份（若有），否則第一個月份
  const today = new Date();
  const todayKey = monthKey(today.getFullYear(), today.getMonth());
  const defaultMonth = monthList.includes(todayKey) ? todayKey : monthList[0];

  monthList.forEach((mk)=>{
    const [y,m] = mk.split("-").map(Number);
    const label = y+"年"+m+"月";

    const tab = document.createElement("div");
    tab.className = "tab" + (mk===defaultMonth ? " active":"");
    tab.textContent = label;
    tab.dataset.month = mk;
    tab.addEventListener("click", ()=>selectMonth(mk));
    tabsEl.appendChild(tab);

    const dim = daysInMonth(y, m-1);
    const card = document.createElement("div");
    card.className = "month-card" + (mk===defaultMonth ? " active":"");
    card.dataset.month = mk;

    const entries = DATA.map((e,idx)=>({...e, idx})).filter(e=>{
      const monthStart = new Date(y, m-1, 1), monthEnd = new Date(y, m-1, dim);
      return e.start <= monthEnd && e.end >= monthStart;
    }).map(e=>{
      const monthStart = new Date(y, m-1, 1), monthEnd = new Date(y, m-1, dim);
      const clipStart = e.start < monthStart ? 1 : e.start.getDate();
      const clipEnd = e.end > monthEnd ? dim : e.end.getDate();
      return {...e, clipStart, clipEnd};
    });

    entries.forEach(e=>{
      e.overlap = entries.some(o => o.idx!==e.idx && !(o.clipEnd < e.clipStart || o.clipStart > e.clipEnd));
    });

    let rulerTicks = "";
    for(let d=1; d<=dim; d+=5){
      const pct = ((d-1)/dim)*100;
      rulerTicks += `<span style="left:${pct}%">${d}</span>`;
    }

    let rowsHtml = entries.map(e=>{
      const leftPct = ((e.clipStart-1)/dim)*100;
      const widthPct = ((e.clipEnd - e.clipStart + 1)/dim)*100;
      return `
        <div class="row">
          <div class="name">${e.name}</div>
          <div class="track">
            <div class="bar${e.overlap ? " overlap":""}" style="left:${leftPct}%; width:${widthPct}%; background:${colorFor(e.name)}">
              ${fmt(e.start)}–${fmt(e.end)}
            </div>
          </div>
        </div>`;
    }).join("");

    const hasOverlap = entries.some(e=>e.overlap);

    card.innerHTML = `
      <div class="month-head">
        <h2>${label}</h2>
        <span>${entries.length} 筆休假</span>
      </div>
      <div class="ruler">${rulerTicks}</div>
      ${rowsHtml}
      ${hasOverlap ? `<div class="flag-row">⚠ 這個月有 <b>日期重疊</b> 的休假，排班前建議先確認</div>` : ""}
    `;
    mainEl.appendChild(card);
  });
}

function selectMonth(mk){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.month===mk));
  document.querySelectorAll(".month-card").forEach(c=>c.classList.toggle("active", c.dataset.month===mk));
}

document.getElementById("refreshBtn").addEventListener("click", load);
load();
</script>
</body>
</html>
